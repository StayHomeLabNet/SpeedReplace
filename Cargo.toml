[workspace]
members = ["crates/speedreplace-core", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
authors = ["StayHomeLabNet"]
repository = "https://github.com/StayHomeLabNet/SpeedReplace"
homepage = "https://github.com/StayHomeLabNet/SpeedReplace"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
regex = "1"
encoding_rs = "0.8"
chardetng = "1.0"
walkdir = "2"
globset = "0.4"
similar = "3"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

