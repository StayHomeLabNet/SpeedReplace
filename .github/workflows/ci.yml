name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        if: runner.os == 'Linux'
        run: pnpm audit --prod --audit-level high
      - name: Install RustSec audit tool
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: cargo audit --no-yanked
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust static analysis
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Build frontend
        run: pnpm --dir apps/desktop build
      - name: Compile desktop application
        run: pnpm --dir apps/desktop tauri build --no-bundle

