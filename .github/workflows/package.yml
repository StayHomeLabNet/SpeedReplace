name: Package desktop apps

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Git ref to package (for example, v1.0.1)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.name }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: msi nsis
            build_args: ""
            rust_targets: ""
            artifact_name: SpeedReplace-Windows-x64
            artifact_paths: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/speedreplace.exe
          - name: Linux
            os: ubuntu-24.04
            bundles: deb appimage
            build_args: ""
            rust_targets: ""
            artifact_name: SpeedReplace-Linux-x64
            artifact_paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
              target/release/speedreplace
          - name: macOS Universal
            os: macos-15
            bundles: dmg
            build_args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            artifact_name: SpeedReplace-macOS-Universal
            artifact_paths: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/speedreplace
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install macOS universal Rust targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}
      - name: Build distribution packages
        run: pnpm --dir apps/desktop tauri build --bundles ${{ matrix.bundles }} ${{ matrix.build_args }}
      - name: Build CLI
        if: runner.os != 'macOS'
        run: cargo build --release -p speedreplace-cli
      - name: Build Universal macOS CLI
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p speedreplace-cli --target aarch64-apple-darwin
          cargo build --release -p speedreplace-cli --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/speedreplace \
            target/aarch64-apple-darwin/release/speedreplace \
            target/x86_64-apple-darwin/release/speedreplace
      - name: Upload distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 30
